name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go vet ./...
      - run: go test -count=1 ./...
      - run: go build ./...
      - name: local integration lab
        run: go test -tags=integration -count=1 ./labs/tests
      - name: API security lab
        run: go test -tags=integration -count=1 ./internal/apisec
      - name: static analyzer (Go SSA)
        run: go test -tags=integration -count=1 ./internal/analyze/gosast
      - name: dry-run smoke test
        run: |
          go build -o rce-finder ./cmd/rce-finder
          printf '%s\n' 'https://example.test' > /tmp/targets.txt
          ./rce-finder -targets /tmp/targets.txt -i-am-authorized -allow-unsigned-local-templates -dry-run
