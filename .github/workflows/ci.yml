name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go vet ./...
      - run: go build ./...
      - name: dry-run smoke test
        run: |
          go build -o rce-finder ./cmd/rce-finder
          echo "https://example.com" > /tmp/targets.txt
          ./rce-finder -targets /tmp/targets.txt -i-am-authorized -dry-run
