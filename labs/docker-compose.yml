services:
  fake-oob:
    build:
      context: ..
      dockerfile: labs/oob/Dockerfile
    command: ["-listen", ":18080"]
    ports:
      - "127.0.0.1:18080:18080"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
  fixture:
    build:
      context: ..
      dockerfile: labs/fixtures/Dockerfile
    command: ["-listen", ":8080"]
    environment:
      RCE_FINDER_FAKE_OOB: "http://fake-oob:18080"
      RCE_FINDER_VULNERABLE: "${RCE_FINDER_VULNERABLE:-false}"
    ports:
      - "127.0.0.1:18081:8080"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
