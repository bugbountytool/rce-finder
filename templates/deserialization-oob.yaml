# Generic insecure-deserialization OOB probe.
#
# Context: endpoints that deserialize attacker-controlled data (Java
# serialized objects, Python pickle, PHP unserialize, etc.) without
# validation are a classic RCE vector once a usable "gadget chain" exists in
# the target's classpath/dependencies. Full exploitation is gadget-chain-
# and-stack specific (e.g. ysoserial payloads for Java), which is out of
# scope for a safe, generic template.
#
# What THIS template checks is a narrower, safer signal: whether an endpoint
# that *looks* like it accepts a serialized-object body will attempt to
# process a minimal, malformed serialized payload containing a network
# callback marker. This is intentionally a weaker, best-effort check — it
# will have false negatives against hardened deserialization. Treat a
# CONFIRMED result here as "deserialization endpoint reachable and worth
# manual gadget-chain testing with your own authorized tooling," not as full
# proof of RCE on its own.
schema_version: rce-finder/v2
id: deserialization-generic-oob
name: Generic Deserialization Endpoint OOB Probe
severity: high
vuln_class: deserialization
cwe: ["CWE-502"]
technologies: ["serialization", "java"]
mode: safe-validation
confidence_requirements:
  - "matching HTTP callback for the issued probe ID"
  - "callback protocol must match this template"
remediation: "Avoid deserializing untrusted data; use data-only formats with strict schemas and integrity checks."
references:
  - https://owasp.org/www-community/vulnerabilities/Deserialization_of_untrusted_data
  - https://github.com/frohoff/ysoserial

oob_protocol: http
method: POST
path: ""
timeout_seconds: 10
body_content_type: application/x-java-serialized-object

injection_points:
  - location: body
    name: payload

# Not a real gadget chain — a marker payload plus a callback URL, used only
# to see whether the endpoint attempts outbound interaction while handling
# the body. Replace with a proper gadget-chain generator (e.g. ysoserial,
# run separately and manually) for real exploitation once this signal fires.
payload: "MARKER_DESERIALIZE_PROBE::callback=http://{{canary}}/cb"
